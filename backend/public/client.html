  <!-- ====== RESTORAN LOGOTIPI LOADER ====== -->
  <script type="module">
    import { loadNestaFirebaseApp } from "./js/nestaFirebaseApp.js";
    import { getDatabase, forceWebSockets, ref, onValue } from "./js/pgRtdb.js";

    const _fbApp = await loadNestaFirebaseApp();
    forceWebSockets();
    const _db = getDatabase(_fbApp);

    function _applyLogo(url) {
      if (!url) return;
      document.querySelectorAll('#headerLogoImg, img.logo-img').forEach(img => {
        img.src = url;
        img.style.objectFit = 'contain';
        img.style.display = 'block';
      });
      const favicon = document.getElementById('faviconLink');
      if (favicon) favicon.href = url;
    }

    const _restId = new URLSearchParams(location.search).get("rest")
      || localStorage.getItem("restaurantId");

    if (_restId) {
      onValue(ref(_db, `restaurants/${_restId}/settings/restaurantLogoUrl`), snap => {
        if (snap.exists() && snap.val()) _applyLogo(snap.val());
      });
    }
  </script>


  <!-- Cart toggle fallback, dark theme enforcer & CSS version bump -->
  <script>
    // Ensure toggleCart works even before module scripts fully load
    window._cartOpen = false;
    function toggleCart() {
      var modal = document.getElementById('cartModal');
      if (!modal) return;
      window._cartOpen = !window._cartOpen;
      if (window._cartOpen) {
        modal.classList.add('open');
        document.body.style.overflow = 'hidden';
      } else {
        modal.classList.remove('open');
        document.body.style.overflow = '';
      }
    }

    // No-op: theme is now handled entirely by client.css and the
    // CSS variables injected by updateCart() in client.js.
    // Kept as a named stub so any existing call-sites don't throw.
    function applyCartDarkTheme() {}

    // ══════════════════════════════════════════
    // 🆕 DARK / LIGHT TEMA — admin.js/waiter.js'dagi window.toggleTheme()/
    // window.toggleWaiterTheme() bilan AYNAN bir xil naqsh: bir xil
    // localStorage kaliti ("app_theme") va bir xil <html data-theme="dark">
    // atributi — shu qurilmada boshqa panelda tanlangan tema shu yerda ham
    // (va aksincha) darhol qo'llanadi. Erta init <head> ichida (yuqorida,
    // FOUC'siz) — bu yerda faqat almashtirish funksiyasi.
    // ══════════════════════════════════════════
    window.toggleClientTheme = function () {
      var html = document.documentElement;
      var isDark = html.getAttribute('data-theme') === 'dark';
      if (isDark) {
        html.removeAttribute('data-theme');
        try { localStorage.setItem('app_theme', 'light'); } catch (e) {}
      } else {
        html.setAttribute('data-theme', 'dark');
        try { localStorage.setItem('app_theme', 'dark'); } catch (e) {}
      }
    };

    // ══════════════════════════════════════════
    // 🆕 Header live date/time (#clientHeaderDateTime) — Waiter'ning
    // .w-center-datetime bilan bir xil vizual rol, sof UI (hech qanday
    // Firebase/biznes-logikaga tegmaydi, faqat brauzer soatini ko'rsatadi).
    // Format: "18 avgust 2026 · 16:55:41" / "18 августа 2026 г. · ..."
    // (to'liq sana — kun, oy nomi, yil — va soniyagacha soat).
    // 🩹 ROOT-CAUSE FIX — avval brauzerning Intl.toLocaleDateString(locale,
    // {month:'long'}) ishlatilardi. "uz-UZ" locale'i uchun ko'p brauzer/OS
    // ICU ma'lumotlarida to'liq o'zbekcha oy nomlari yo'q — natijada
    // "2026 M08 18" kabi noto'g'ri, tarjima qilinmagan fallback chiqardi
    // (screenshot orqali tasdiqlangan). Endi oy nomi Intl'dan EMAS,
    // loyihaning o'z tarjima tizimidan (window.t("month_aug",...) —
    // langs.js'dagi mavjud kalitlar, boshqa hech qanday joyda o'zgartirilmadi)
    // olinadi — bu HAR DOIM to'g'ri ishlaydi, brauzer/OS'ning Intl
    // ma'lumotlariga bog'liq emas. Soat (HH:MM:SS) ham endi oddiy
    // raqamlar bilan (pad2) — Intl vaqt formatlashiga ham ehtiyoj yo'q.
    // ══════════════════════════════════════════
    var _CLOCK_MONTH_KEYS = ["month_jan","month_feb","month_mar","month_apr","month_may","month_jun",
                              "month_jul","month_aug","month_sep","month_oct","month_nov","month_dec"];
    var _CLOCK_MONTH_FALLBACK = ["Yanvar","Fevral","Mart","Aprel","May","Iyun","Iyul","Avgust","Sentabr","Oktabr","Noyabr","Dekabr"];
    function _clockPad2(n) { return (n < 10 ? "0" : "") + n; }
    function _clientHeaderClockTick() {
      var el = document.getElementById('clientHeaderDateTime');
      if (!el) return;
      var now = new Date();
      var lang = 'uz';
      try { lang = localStorage.getItem('app_lang') || 'uz'; } catch (e) {}
      var monthName = (typeof window.t === 'function')
        ? window.t(_CLOCK_MONTH_KEYS[now.getMonth()], _CLOCK_MONTH_FALLBACK[now.getMonth()])
        : _CLOCK_MONTH_FALLBACK[now.getMonth()];
      var yearSuffix = (lang === 'ru') ? ' г.' : '';
      var datePart = now.getDate() + ' ' + monthName + ' ' + now.getFullYear() + yearSuffix;
      var timePart = _clockPad2(now.getHours()) + ':' + _clockPad2(now.getMinutes()) + ':' + _clockPad2(now.getSeconds());
      el.textContent = datePart + ' · ' + timePart;
    }
    _clientHeaderClockTick();
    setInterval(_clientHeaderClockTick, 1000);
    // 🩹 ROOT-CAUSE FIX ("2 marta tarjima bo'lish" — til almashtirilganda
    // eski tildagi matn ~1 soniya ko'rinib turardi, chunki setInterval
    // faqat har soniyada bir marta qayta hisoblardi). Endi til
    // almashishi bilan DARHOL qayta chiziladi. window.onLangChange
    // hali tayyor bo'lmasa (bu skript module'lardan oldin ishga tushishi
    // mumkin), qisqa fursatdan keyin qayta urinib ko'radi.
    (function _hookClientClockToLangChange(attemptsLeft) {
      if (typeof window.onLangChange === 'function') {
        window.onLangChange(_clientHeaderClockTick);
      } else if (attemptsLeft > 0) {
        setTimeout(function () { _hookClientClockToLangChange(attemptsLeft - 1); }, 200);
      }
    })(25);

    // Close on overlay click
    document.addEventListener('DOMContentLoaded', function() {
      var modal = document.getElementById('cartModal');
      if (modal) {
        modal.addEventListener('click', function(e) {
          if (e.target === modal) toggleCart();
        });
      }
    });



  </script>
